name: Combate parcial com duas fichas reais
on:
  pull_request:
    paths:
      - "experimental/integration/motor_combate_fichas_srd.py"
      - "src/ascend/efeitos_srd.py"
      - "src/ascend/ciclo_efeitos.py"
      - "tests/ciclo/**"
      - "experimental/legacy/src/motor_condicoes_srd.py"
      - "tests/efeitos/**"
      - "tests/integration/test_efeitos_reais.py"
      - "tests/integration/test_combate_duas_fichas_reais.py"
      - "tests/integration/test_gibbering_78_real.py"
      - ".github/workflows/validate-combate-duas-fichas.yml"
      - "src/ascend/fichas_srd.py"
      - "experimental/integration/motor_fichas_poc.py"
      - "config/catalogo_srd.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combate-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: george-vepo/Catalogo-SRD
          ref: 03f84e8426f469ef6a0e471faea2093b7c0b69c9
          path: external/Catalogo-SRD
          persist-credentials: false
          sparse-checkout: |
            docs/catalogo/data/deck-celestial-40.json
            docs/catalogo/data/deck-aberracao-40.json
            operational/research/decks/aberracao-40-20261014/fichas_srd521_integral_3.json
            operational/research/decks/celestial-40-20261015/fichas_srd521_giant_owl_1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir fichas, iniciativa, turnos, ataques e efeitos SRD no recorte
        env:
          CATALOGO_SRD_DIR: external/Catalogo-SRD
        run: |
          python -m unittest discover -s tests/integration -p test_combate_duas_fichas_reais.py -v
          python -m unittest discover -s tests/integration -p test_gibbering_78_real.py -v
          python -m unittest discover -s tests/perfil -v
          python -m unittest discover -s tests/efeitos -v
          python -m unittest discover -s tests/ciclo -v
          python -m unittest discover -s tests/integration -p test_efeitos_reais.py -v
          python -m unittest discover -s tests/integration -p test_legacy_hook_compat.py -v
