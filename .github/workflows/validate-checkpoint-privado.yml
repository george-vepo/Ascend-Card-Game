name: Armazenamento cifrado de checkpoint privado
on:
  pull_request:
    paths:
      - "src/ascend/checkpoint_privado.py"
      - "tests/integration/test_checkpoint_privado.py"
      - "docs/CHECKPOINT_PRIVADO_EXPERIMENTAL.md"
      - ".github/workflows/validate-checkpoint-privado.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-privado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependência de criptografia
        run: python -m pip install 'cryptography>=42,<48'
      - name: Testar criptografia e idempotência de checkpoints
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/integration -p test_checkpoint_privado.py -v
