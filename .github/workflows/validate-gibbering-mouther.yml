name: Gibbering Mouther — ficha SRD e preflight puro
on:
  pull_request:
    paths:
      - "src/ascend/gibbering_mouther_srd.py"
      - "experimental/integration/preflight_gibbering_mouther.py"
      - "tests/integration/test_gibbering_mouther_preflight_real.py"
      - ".github/workflows/validate-gibbering-mouther.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mouther-srd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: george-vepo/Catalogo-SRD
          ref: 03f84e8426f469ef6a0e471faea2093b7c0b69c9
          path: external/Catalogo-SRD
          persist-credentials: false
          sparse-checkout: |
            docs/catalogo/data/deck-celestial-40.json
            docs/catalogo/data/deck-aberracao-40.json
            operational/research/decks/aberracao-40-20261014/fichas_srd521_integral_3.json
            operational/research/decks/celestial-40-20261015/fichas_srd521_giant_owl_1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar preflight de Mouther contra ficha externa canônica
        env:
          CATALOGO_SRD_DIR: external/Catalogo-SRD
        run: |
          python -m unittest discover -s tests/integration -p test_gibbering_mouther_preflight_real.py -v
