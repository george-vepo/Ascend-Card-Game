name: Terceira criatura — Roper SRD parcial
on:
  pull_request:
    paths:
      - "src/ascend/perfil_combate_srd.py"
      - "experimental/integration/motor_roper_basico.py"
      - "src/ascend/tentaculo_roper_srd.py"
      - "tests/integration/test_roper_tentacle_real.py"
      - "src/ascend/fuga_roper_srd.py"
      - "src/ascend/testes_d20_srd.py"
      - "tests/rolagens/**"
      - "tests/integration/test_poisoned_escape_roper_real.py"
      - "tests/integration/test_fuga_tentaculo_roper_real.py"
      - "tests/integration/test_roper_basico_real.py"
      - "tests/integration/test_reel_preflight_real.py"
      - "tests/integration/test_roper_ko_grapple_cleanup_real.py"
      - "tests/integration/test_roper_multiattack_preflight_real.py"
      - "tests/integration/test_roper_multiattack_atomic_safe_real.py"
      - "tests/integration/test_roper_grapple_multiplo_real.py"
      - ".github/workflows/validate-roper-basico.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roper-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: george-vepo/Catalogo-SRD
          ref: 03f84e8426f469ef6a0e471faea2093b7c0b69c9
          path: external/Catalogo-SRD
          persist-credentials: false
          sparse-checkout: |
            docs/catalogo/data/deck-celestial-40.json
            docs/catalogo/data/deck-aberracao-40.json
            operational/research/decks/aberracao-40-20261014/fichas_srd521_integral_3.json
            operational/research/decks/celestial-40-20261015/fichas_srd521_giant_owl_1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar fixtures Roper com catálogo externo
        env:
          CATALOGO_SRD_DIR: external/Catalogo-SRD
        run: |
          python -m unittest discover -s tests/integration -p test_roper_basico_real.py -v
          python -m unittest discover -s tests/integration -p test_roper_tentacle_real.py -v
          python -m unittest discover -s tests/integration -p test_fuga_tentaculo_roper_real.py -v
          python -m unittest discover -s tests/rolagens -v
          python -m unittest discover -s tests/integration -p test_poisoned_escape_roper_real.py -v
          python -m unittest discover -s tests/integration -p test_reel_preflight_real.py -v
          python -m unittest discover -s tests/integration -p test_roper_ko_grapple_cleanup_real.py -v
          python -m unittest discover -s tests/integration -p test_roper_multiattack_preflight_real.py -v
          python -m unittest discover -s tests/integration -p test_roper_multiattack_atomic_safe_real.py -v
          python -m unittest discover -s tests/integration -p test_roper_grapple_multiplo_real.py -v
